# Binder R-only test — minimal Python + full R stack
#
# Purpose: isolate whether the R packages alone build and push successfully.

name: notebook

channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Minimal Python (required for Binder)
  - python=3.11
  - jupyterlab
  - ipykernel

  # ── R stack ──────────────────────────────────────────────────
  - r-base=4.4
  - r-irkernel

  # Tidyverse & visualization
  - r-tidyverse
  - r-ggrepel
  - r-patchwork
  - r-pheatmap
  - r-rcolorbrewer
  - r-viridis

  # Workflow & reproducibility
  - r-targets
  - r-tarchetypes
  - r-crew

  # Reporting / interactivity
  - r-rmarkdown
  - r-knitr
  - r-quarto
  - r-dt
  - r-jsonlite
  - r-here

  # Bioconductor — bulk RNA-seq
  - bioconductor-deseq2
  - bioconductor-edger
  - bioconductor-limma
  - bioconductor-tximport
  - bioconductor-biocparallel

  # Bioconductor — single-cell R
  - bioconductor-singlecellexperiment
  - bioconductor-scran
  - bioconductor-scater

  # Bioconductor — enrichment / pathway
  - bioconductor-clusterprofiler
  - bioconductor-fgsea
  - bioconductor-enrichplot

  # Bioconductor — visualization
  - bioconductor-complexheatmap
  - bioconductor-enhancedvolcano
