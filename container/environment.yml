# Pinned conda environment for bioinformatics analysis
# Managed inside the Apptainer container at /opt/conda/envs/bioinfo
#
# To regenerate the fully-resolved lockfile after building:
#   singularity exec bioinfo_latest.sif \
#     /opt/conda/bin/conda list --explicit > container/conda_explicit_spec.txt
#
# That explicit spec guarantees bit-identical rebuilds including build hashes.

name: bioinfo

channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # ---------------------------------------------------------------
  # Python interpreter (pinned)
  # ---------------------------------------------------------------
  - python=3.11.9

  # ---------------------------------------------------------------
  # Jupyter stack
  # ---------------------------------------------------------------
  - jupyterlab=4.2.5
  - jupyter_server=2.14.2
  - notebook=7.2.2
  - nbformat=5.10.4
  - ipykernel=6.29.5
  - ipywidgets=8.1.3
  - nbconvert=7.16.4
  - papermill=2.6.0

  # ---------------------------------------------------------------
  # Core scientific Python
  # ---------------------------------------------------------------
  - numpy=1.26.4
  - pandas=2.2.2
  - scipy=1.14.0
  - matplotlib=3.9.2
  - seaborn=0.13.2
  - scikit-learn=1.5.1
  - statsmodels=0.14.2
  - plotly=5.23.0

  # ---------------------------------------------------------------
  # Data I/O
  # ---------------------------------------------------------------
  - h5py=3.11.0
  - zarr=2.18.2
  - pyarrow=17.0.0
  - openpyxl=3.1.5

  # ---------------------------------------------------------------
  # Bioinformatics Python packages
  # ---------------------------------------------------------------
  - biopython=1.84
  - pysam=0.22.1
  - pybedtools=0.10.0
  - htseq=2.0.5
  - anndata=0.10.8
  - scanpy=1.10.2
  - leidenalg=0.11.0
  - python-igraph=1.0.0

  # ---------------------------------------------------------------
  # Sequence analysis tools (via bioconda)
  # ---------------------------------------------------------------
  - hisat2=2.2.1
  - kallisto=0.51.1
  - salmon=1.10.3
  - subread=2.0.6           # featureCounts
  - bowtie2=2.5.4
  - minimap2=2.28
  - trim-galore=0.6.10
  - cutadapt=4.9
  - fastp=0.23.4
  - multiqc=1.21

  # ---------------------------------------------------------------
  # Variant calling & population genomics
  # ---------------------------------------------------------------
  - vcftools=0.1.16
  - plink=1.90b6.21
  - mosdepth=0.3.9
  - htslib=1.20

  # ---------------------------------------------------------------
  # Genome browser / format converters
  # ---------------------------------------------------------------
  - ucsc-bedgraphtobigwig=469
  - ucsc-bigwigtobedgraph=469
  - ucsc-fatotwoBit=469

  # ---------------------------------------------------------------
  # Workflow managers
  # ---------------------------------------------------------------
  - snakemake=8.16.0

  # ---------------------------------------------------------------
  # Utilities
  # ---------------------------------------------------------------
  - tqdm=4.66.5
  - pyyaml=6.0.2
  - rich=13.7.1
  - click=8.1.7

  # pip-only packages (not available on conda-forge/bioconda)
  - pip:
    - rpy2==3.5.16           # R-Python bridge
    - pydeseq2==0.4.10       # Python DESeq2 implementation
    - decoupler==1.8.0        # Pathway activity estimation
    - liana-py==1.3.0         # Cell-cell communication
    - harmonypy==0.0.10       # Batch correction
    - scvi-tools==1.1.6       # Deep learning for single-cell
